name: latin_music
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pandas
  - numpy
  - tqdm
  - librosa
  - pip
  - pip:
    - transformers
    - yt-dlp
    - python-dotenv
    - huggingface_hub
    - ffmpeg-python
    - kaggle
    - kagglehub
    - --extra-index-url https://download.pytorch.org/whl/cu126
    - "torch>=2.11.0"
    - "torchvision>=0.26.0"
    - "torchaudio>=2.11.0"
    - soundfile
